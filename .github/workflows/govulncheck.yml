name: govulncheck

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: 'stable'
      working-directory:
        description: 'Working directory to run govulncheck in'
        required: false
        type: string
        default: '.'
      mode:
        description: 'Analysis mode (source or binary)'
        required: false
        type: string
        default: 'source'
      tags:
        description: 'Build tags to consider when analyzing source code'
        required: false
        type: string
        default: ''
      include-tests:
        description: 'Include test files in analysis'
        required: false
        type: boolean
        default: false
      json-output:
        description: 'Output vulnerabilities in JSON format'
        required: false
        type: boolean
        default: false
      imports-only:
        description: 'Only analyze imports, not function bodies'
        required: false
        type: boolean
        default: false
      symbolize:
        description: 'Symbolize stack traces in output'
        required: false
        type: boolean
        default: false

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        id: scan
        run: |
          set -euo pipefail
          cd "${{ inputs.working-directory }}"

          if ! command -v govulncheck >/dev/null 2>&1; then
            echo "::error::govulncheck binary not found on PATH after install"
            exit 1
          fi

          ARGS=()
          [ "${{ inputs.mode }}" != "source" ] && ARGS+=("-mode=${{ inputs.mode }}")
          [ -n "${{ inputs.tags }}" ] && ARGS+=("-tags=${{ inputs.tags }}")
          [ "${{ inputs.include-tests }}" = "true" ] && ARGS+=("-test")
          [ "${{ inputs.json-output }}" = "true" ] && ARGS+=("-json")
          [ "${{ inputs.imports-only }}" = "true" ] && ARGS+=("-imports-only")
          [ "${{ inputs.symbolize }}" = "true" ] && ARGS+=("-symbolize")

          echo "Running govulncheck with args: ${ARGS[*]:-<none>}"
          if ! govulncheck "${ARGS[@]}" ./...; then
            echo "::error::govulncheck found vulnerabilities"
            exit 1
          fi
        continue-on-error: true

      - name: Check scan status
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::govulncheck found vulnerabilities. Please review the scan results above."
          exit 1
